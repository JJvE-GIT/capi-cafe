<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capi Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gabarito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#D7EDCB;--surface:#F7FBEA;--surface2:#E9F4D8;--ink:#1F3B2E;--muted:#4A6656;
  --yuzu:#FFBE1A;--yuzu-edge:#C98C00;--on-yuzu:#2B2410;--water:#1F8F89;--berry:#C92C55;
  --edge:#1F3B2E;--thin:rgba(31,59,46,.2);--mark:rgba(31,59,46,.72);
  --steam:#D5E7E2;--steam2:#FBFEFC;--hill:#9ED18B;--grass:#A8D98C;--grass2:#8FC873;--soil:#7A5236;--soil2:#5E3E27;--tile:#D6EEF0;--tile2:#BCDFE3;--pool:#5CC9C2;--frame:#8A5A34;--frame2:#5E3A20;--wall:#BFE3D2;--wall2:#A9D6C2;--floor:#D9A873;--floor2:#C88F58;--sky:#BDE9FF;--wood:#8A5A34;
  --r0:#FFC4BC;--r1:#FFE083;--r2:#B6E39F;--r3:#A5DBF2;--r4:#D3C0F6;--r5:#F8B6DA;--r6:#FFC88D;--r7:#A3E4CE;--r8:#DFD3AE;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10302A;--surface:#1B4239;--surface2:#245247;--ink:#EEF7E4;--muted:#B3CFBD;
  --water:#58D2C7;--berry:#FF8AA5;--edge:#06201A;--thin:rgba(6,32,26,.35);--mark:rgba(255,255,255,.86);
  --steam:#4D736B;--steam2:#7FA69D;--hill:#2E6B45;--grass:#3E7F4E;--grass2:#336B41;--soil:#4E3423;--soil2:#3A2618;--tile:#2B5A5E;--tile2:#234A4E;--pool:#2E8F8A;--frame:#6B4327;--frame2:#3E2513;--wall:#2A5E55;--wall2:#234F47;--floor:#6E4A30;--floor2:#5C3C26;--sky:#16264F;--wood:#57361F;
  --r0:#B5615A;--r1:#A98B2B;--r2:#5B9346;--r3:#3C84A8;--r4:#7A62B3;--r5:#AE5A90;--r6:#B87236;--r7:#35967C;--r8:#887C57;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10302A;--surface:#1B4239;--surface2:#245247;--ink:#EEF7E4;--muted:#B3CFBD;
  --water:#58D2C7;--berry:#FF8AA5;--edge:#06201A;--thin:rgba(6,32,26,.35);--mark:rgba(255,255,255,.86);
  --steam:#4D736B;--steam2:#7FA69D;--hill:#2E6B45;--grass:#3E7F4E;--grass2:#336B41;--soil:#4E3423;--soil2:#3A2618;--tile:#2B5A5E;--tile2:#234A4E;--pool:#2E8F8A;--frame:#6B4327;--frame2:#3E2513;--wall:#2A5E55;--wall2:#234F47;--floor:#6E4A30;--floor2:#5C3C26;--sky:#16264F;--wood:#57361F;
  --r0:#B5615A;--r1:#A98B2B;--r2:#5B9346;--r3:#3C84A8;--r4:#7A62B3;--r5:#AE5A90;--r6:#B87236;--r7:#35967C;--r8:#887C57;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Gabarito","Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,.display{font-family:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:400;line-height:1.05}
svg{display:block}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px}

.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top h1{font-size:30px;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);padding:6px 12px 6px 8px;border-radius:99px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.scene{border-radius:26px 26px 12px 12px;overflow:hidden;background:var(--wall);border:3px solid var(--edge)}
.scene svg{width:100%;height:auto}
.scene .capy-g{cursor:pointer}
.scene .pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
.bubble{background:var(--surface);border-radius:14px;padding:9px 13px;margin-top:10px;min-height:46px;color:var(--ink);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:10px 18px;border-radius:18px;background:var(--yuzu);color:var(--on-yuzu);font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:23px;box-shadow:0 6px 0 var(--yuzu-edge);margin-bottom:6px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yuzu-edge)}
.btn.quiet{background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--surface2);font-size:20px}
.btn.quiet:active{box-shadow:0 2px 0 var(--surface2)}
.progress{margin:14px 0}
.progress .lbl{font-weight:600;margin-bottom:6px}
.bar{height:12px;background:var(--surface);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water);border-radius:9px}
.daily{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;margin-top:14px;width:100%;text-align:left}
.daily .big{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;line-height:1.1}
.daily .sub{color:var(--muted);font-size:15px}
.daily .cal{width:52px;height:52px;background:var(--water);color:#fff;border-radius:14px;display:grid;place-items:center;font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:24px;flex:none}
:root[data-theme="dark"] .daily .cal{color:#10302A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .daily .cal{color:#10302A}}

nav{display:flex;gap:4px;padding:6px 10px 8px;background:var(--surface);border-radius:20px 20px 0 0}
nav button{flex:1;min-height:52px;border-radius:13px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{background:var(--surface2);color:var(--ink);font-weight:800}

.section-h{font-size:24px;margin:18px 0 3px}
.section-p{color:var(--muted);margin-bottom:12px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;line-height:1}
.lv small{font-family:"Gabarito",sans-serif;font-size:11px;color:var(--yuzu-edge);letter-spacing:0;margin-top:3px;font-weight:800;min-height:13px}
.lv.next{background:var(--yuzu);color:var(--on-yuzu)}
.lv:disabled{opacity:.5;cursor:default;background:var(--surface2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv small{color:var(--yuzu)}}
:root[data-theme="dark"] .lv small{color:var(--yuzu)}

.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .pre{background:var(--wall);border-radius:12px;overflow:hidden;height:104px;padding:6px}
.item .pre svg{width:100%;height:100%}
.item b{font-weight:800;line-height:1.15}
.buy{min-height:44px;border-radius:12px;background:var(--yuzu);color:var(--on-yuzu);font-weight:800;margin-top:auto}
.buy:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.capys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:18px;padding:12px;text-align:center}
.card svg{width:128px;height:auto;margin:0 auto 6px}
.card b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:20px;display:block}
.card span{color:var(--muted);font-size:15px;line-height:1.25;display:block;margin-top:3px}
.card.locked svg{filter:brightness(0) opacity(.28)}
:root[data-theme="dark"] .card.locked svg{filter:brightness(0) invert(1) opacity(.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.locked svg{filter:brightness(0) invert(1) opacity(.2)}}

#game{height:100%;display:flex;flex-direction:column;padding:0 12px 12px}
.g-top{display:flex;align-items:center;gap:10px;padding:10px 0}
.g-top h2{font-size:24px;flex:1;min-width:0}
.meter{display:flex;gap:1px}.meter svg{width:22px;height:22px;color:var(--thin)}.meter svg.on{color:var(--yuzu)}.meter svg.lost{animation:lost .55s ease}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:19px}
.board-row{flex:1;min-height:0;display:flex;gap:9px;align-items:center}
.board-wrap{flex:1;min-width:0;height:100%;container-type:size;display:grid;place-items:center}
.lift{flex:none;width:60px;display:flex;flex-direction:column;gap:7px;padding:5px;background:var(--frame);border-radius:14px;box-shadow:0 5px 0 var(--frame2)}
.lift button{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:7px;overflow:hidden;opacity:.72}
.lift button svg{width:100%;height:100%}
.lift button[aria-current]{outline:3px solid var(--yuzu);outline-offset:1px;opacity:1}
.lift .no{position:absolute;left:3px;top:2px;min-width:16px;height:16px;border-radius:5px;background:var(--edge);color:#fff;font-size:12px;font-weight:800;line-height:16px;text-align:center}
.lift .done .no{background:var(--water)}
.tower{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.tower svg{width:56px;height:56px;border-radius:7px;border:2px solid var(--edge)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.duo .daily{margin-top:0;padding:8px 10px;gap:9px;min-width:0}
.duo .daily.wide{grid-column:1/3}
.duo .cal{width:38px;height:38px;font-size:19px;border-radius:11px}
.duo .cal svg{width:24px;height:24px}
.duo .big{font-size:17px}.duo .sub{font-size:13px}
.scene{position:relative}
.scene .bubble{position:absolute;left:8px;right:8px;top:8px;margin:0;min-height:0;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 2px 0 var(--edge)}
.scene .bubble.on{opacity:1;transform:none}
.board.shape{background:transparent;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 5px 0 var(--frame2))}
.hole{display:block}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shapecard{background:var(--surface);border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shapecard svg{width:74px;height:74px}
.shapecard b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:17px;line-height:1.1}
.shapecard small{font-size:11px;color:var(--yuzu-edge);font-weight:800;min-height:13px}
.shapeart svg{width:96px;height:96px;margin:0 auto 8px}
.steamart.shapeart{width:auto}
.score{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;color:var(--water);font-variant-numeric:tabular-nums}
.timer.low{color:var(--berry);animation:tickp 1s ease-in-out infinite}
.timer.hit{color:var(--berry);animation:oops .34s}
.bigscore{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:58px;line-height:1;color:var(--water);margin:6px 0}
.heart{position:absolute;width:calc(100%/var(--n)*.42);aspect-ratio:1;margin:calc(-100%/var(--n)*.21) 0 0 calc(-100%/var(--n)*.21);z-index:3;pointer-events:none;animation:heartin .42s cubic-bezier(.3,1.9,.5,1) both}
.heart svg{width:100%;height:100%}
.cell .c.hug{animation:hugin .3s ease-out both}
.c.hug .eye-o{display:none}.c.hug .eye-h{display:inline}
.won .c.hug{animation:bob .6s ease-in-out both;animation-delay:calc(var(--i)*70ms)}
.seg{display:flex;background:var(--surface);border-radius:13px;padding:4px;margin-bottom:6px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--yuzu);color:var(--on-yuzu)}
.cell .shade{width:80%;height:80%;color:var(--mark);opacity:.4}
.board.instant .cell:not(.nudge){animation:none}
.board.up{animation:liftup .26s ease-out}.board.down{animation:liftdown .26s ease-out}
.board{width:min(100cqw,100cqh);aspect-ratio:1;display:grid;border:6px solid var(--frame);border-radius:18px;overflow:hidden;touch-action:none;background:var(--edge);position:relative;box-shadow:0 6px 0 var(--frame2)}
.board.oops{animation:oops .34s}
.ghost{position:absolute;width:calc(100%/var(--n)*.55);aspect-ratio:1;margin:calc(-100%/var(--n)*.275) 0 0 calc(-100%/var(--n)*.275);border-radius:50%;background:rgba(255,255,255,.72);border:3px solid var(--ink);pointer-events:none;z-index:3}
.ghost.tap{animation:gtap 1.2s ease-in-out infinite}.ghost.double{animation:gdbl 1.4s ease-in-out infinite}.ghost.swipe{animation:gswipe 1.5s ease-in-out infinite}
.cell{position:relative;display:grid;place-items:center;border:.5px solid var(--thin);min-width:0;min-height:0;padding:0;border-radius:0;animation:cellin .34s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0ms);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.cell.rc{filter:brightness(1.1)}
.cell.pulse{filter:brightness(1.14) saturate(1.1);transition:filter .3s}
.cell.nudge{animation:nudge .24s}
.cell.cause{outline:4px solid var(--berry);outline-offset:-4px;z-index:3}
.cell.tut{outline:4px solid var(--yuzu);outline-offset:-4px;z-index:3}
.cell.ring::before{content:"";position:absolute;inset:8%;border-radius:50%;border:3px solid #fff;animation:ring .5s ease-out both;pointer-events:none}
.cell.t{border-top:2px solid var(--edge)}.cell.r{border-right:2px solid var(--edge)}.cell.b{border-bottom:2px solid var(--edge)}.cell.l{border-left:2px solid var(--edge)}
.cell:focus-visible{outline:3px solid var(--water);outline-offset:-3px;z-index:2}
.cell svg{width:100%;height:100%;grid-area:1/1;position:relative;z-index:2}
.cell.fogged{border:0!important;box-shadow:none}
.fog{position:absolute;inset:-1px;z-index:1;background-color:var(--steam);background-image:radial-gradient(circle at 18% 24%,var(--steam2) 0 9%,transparent 15%),radial-gradient(circle at 62% 16%,var(--steam2) 0 12%,transparent 19%),radial-gradient(circle at 40% 52%,var(--steam2) 0 13%,transparent 21%),radial-gradient(circle at 84% 58%,var(--steam2) 0 11%,transparent 18%),radial-gradient(circle at 20% 84%,var(--steam2) 0 12%,transparent 19%),radial-gradient(circle at 66% 90%,var(--steam2) 0 10%,transparent 17%);background-size:calc(var(--n)*100%) calc(var(--n)*100%);background-position:calc(var(--c)/(var(--n) - 1)*100%) calc(var(--w)/(var(--n) - 1)*100%);transition:opacity .42s ease-out,transform .42s ease-out;pointer-events:none}
.fog.gone{opacity:0;transform:scale(1.4) translateY(-10%)}
.steamart{width:190px;margin:0 auto 8px}
.intro{margin-bottom:10px;line-height:1.35}
dialog .intro:last-of-type{margin-bottom:16px}
.cell .c{width:92%;height:92%;animation:plop .24s cubic-bezier(.3,1.8,.5,1) both}
.cell .c.nope{animation:nope .6s ease both}
.cell .x.bad{color:var(--berry);width:50%;height:50%;animation:plop .2s both}
.cell .x{width:42%;height:42%;color:var(--mark)}
.cell.dot::after{position:relative;z-index:2;content:"";width:16%;aspect-ratio:1;border-radius:50%;background:var(--mark);opacity:.55;grid-area:1/1}
.cell.hint{outline:4px solid var(--water);outline-offset:-4px;z-index:3;box-shadow:inset 0 0 0 4px var(--water);animation:glow .9s ease-in-out 3}
.eye-h{display:none}
.won .eye-o{display:none}.won .eye-h{display:inline}
.won .c{animation:bob .6s ease-in-out both;animation-delay:calc(var(--i)*70ms)}
.coach{min-height:46px;padding:8px 2px 4px;font-weight:600;text-align:center;line-height:1.25}
.tools{display:flex;gap:8px}
.tools button{flex:1;min-height:52px;border-radius:15px;background:var(--surface);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.tools svg{width:21px;height:21px}
.tools button:disabled{opacity:.45;cursor:default}
.drop{position:absolute;top:-10%;width:7%;aspect-ratio:1;border-radius:50%;background:var(--yuzu);animation:fall 1s ease-in both;pointer-events:none}

dialog{border:0;border-radius:26px;background:var(--surface);color:var(--ink);padding:22px 18px 16px;width:min(92vw,400px);text-align:center}
dialog::backdrop{background:rgba(9,36,30,.6)}
dialog h2{font-size:30px;margin-bottom:6px}
.stars{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.stars svg{width:44px;height:44px;color:var(--surface2)}
.stars svg.on{color:var(--yuzu);animation:starin .42s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(var(--k)*190ms)}
.reward{font-weight:800;font-size:19px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.reward svg{width:24px;height:24px}
.newcapy{background:var(--surface2);border-radius:18px;padding:12px;margin:8px 0 14px}
.newcapy svg{width:150px;margin:0 auto 6px;animation:reveal .8s .75s both}
.bonus{font-weight:800;color:var(--water);margin:-6px 0 10px}
.bar i{transition:width .6s ease}
.tips{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border-radius:14px;padding:8px 12px;margin-top:10px;text-align:left}
.tips:disabled{cursor:default}
.tips .jar svg{width:30px;height:30px}
.tips .tt{flex:1;min-width:0}.tips b{display:block;line-height:1.1;margin-bottom:4px}.tips .bar{display:block;height:7px;background:var(--surface2)}
.tips .get{font-weight:800;background:var(--yuzu);color:var(--on-yuzu);padding:7px 12px;border-radius:10px;white-space:nowrap}
.tips:disabled .get{background:var(--surface2);color:var(--muted)}
.fly{position:fixed;width:16px;height:16px;border-radius:50%;background:var(--yuzu);z-index:9;pointer-events:none;animation:fly .75s cubic-bezier(.5,0,.8,.6) both}
.scene .in{transform-box:fill-box;transform-origin:center bottom;animation:breath 3.8s ease-in-out infinite;animation-delay:var(--b)}
.scene .in.hop{animation:hop .5s ease}
.scene .eye-o{transform-box:fill-box;transform-origin:center;animation:blink 5.2s linear infinite;animation-delay:var(--b)}
.newcapy b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:21px;display:block}
dialog .btn{margin-bottom:12px}
dialog .row{display:flex;justify-content:space-between;align-items:center;min-height:52px;gap:10px;text-align:left;font-weight:600}
dialog .switch{min-width:64px;min-height:40px;border-radius:12px;background:var(--surface2);font-weight:800}
dialog .switch[aria-checked="true"]{background:var(--water);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) dialog .switch[aria-checked="true"]{color:#10302A}}
:root[data-theme="dark"] dialog .switch[aria-checked="true"]{color:#10302A}
.share{background:var(--surface2);border-radius:12px;padding:10px;font-weight:600;white-space:pre-line;margin-bottom:12px;user-select:text;-webkit-user-select:text}
#toast{position:absolute;left:16px;right:16px;bottom:82px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.on{opacity:1}
.steam path{animation:steam 4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.3s}.steam path:nth-child(3){animation-delay:2.6s}
@keyframes liftup{from{transform:translateY(16%);opacity:.3}to{transform:none;opacity:1}}
@keyframes liftdown{from{transform:translateY(-16%);opacity:.3}to{transform:none;opacity:1}}

.rooms{display:flex;gap:6px;align-items:center;margin-bottom:8px}

.roomc.locked{color:var(--muted)}
.cozy{margin-left:auto;display:flex;gap:1px}.cozy svg{width:15px;height:15px;color:var(--thin)}.cozy svg.on{color:var(--yuzu)}

.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.fxh:nth-child(2n){animation-delay:.12s;margin-left:2px}
.fxg{width:34px;height:34px;animation:riseg 1.3s cubic-bezier(.3,1.5,.5,1) both}
.act{cursor:pointer}
.act .bob{transform-box:fill-box;transform-origin:center bottom}

.act.st-idle .bob,.act.st-sit .bob{animation:breath 3.6s ease-in-out infinite}
.act.st-eat .bob{animation:chew .3s ease-in-out infinite}
.act.pet .bob{animation:hopr .55s ease}
.act.st-sleep .eye-o,.act.st-soak .eye-o{display:none}
.eye-c{display:none}.act.st-sleep .eye-c,.act.st-soak .eye-c{display:inline}
.act .zz{animation:zz 2.4s ease-in-out infinite}
.act .selm{animation:selm .9s ease-in-out infinite}
.act .munch{animation:munchf 2.6s steps(4) both}
.act .ripple{animation:ripple 2.2s ease-in-out infinite}
.gift{cursor:pointer}.gift .gin{transform-box:fill-box;transform-origin:center bottom;animation:giftb 1.8s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
.plot{cursor:pointer}.ripe svg{animation:giftb 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bobx{animation:bobx 3s ease-in-out infinite}.bobx:nth-child(2n){animation-delay:-1.2s}
.fall{animation:fall2 .8s linear infinite}
.night .glow{filter:drop-shadow(0 0 5px #FFE08A)}
.dec.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
.panel{background:var(--surface);border-radius:0 0 18px 18px;padding:10px 10px 12px;margin-top:-3px;border:3px solid var(--edge);border-top:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.av{position:relative;flex:none;width:52px;height:52px;border-radius:50%;padding:5px;background:conic-gradient(var(--water) calc(var(--f)*1%),var(--surface2) 0)}

.av.sel{outline:3px solid var(--yuzu);outline-offset:1px}

.det{margin-top:6px}
.det.empty{color:var(--muted);font-weight:600;text-align:center;padding:6px 0 2px}
.dh{display:flex;align-items:center;gap:8px}.dh b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:23px}

.stt{color:var(--muted);font-weight:600;margin:2px 0 8px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-weight:700;font-size:14px}

.foods{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}

.food .fi{width:32px;height:32px}

.goals{background:var(--surface);border-radius:18px;padding:12px;margin-top:12px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.gh b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:20px}.gh span{color:var(--muted);font-weight:700}
.goal{display:flex;align-items:center;gap:8px;min-height:44px;border-top:1px solid var(--surface2)}
.goal .gt{flex:1;font-weight:600}.goal.got .gt{color:var(--muted);text-decoration:line-through}
.gp{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ok{font-weight:800;color:var(--water)}
.claim{min-height:36px;padding:0 12px;border-radius:10px;background:var(--yuzu);color:var(--on-yuzu);font-weight:800}

.fcard .buy{width:100%;margin-top:6px}
.item .pre.tuin{background:var(--grass)}.item .pre.bad{background:var(--tile)}

function attacks(n,reg,a,b){if(a===b)return false;const ra=a/n|0,ca=a%n,rb=b/n|0,cb=b%n;return ra===rb||ca===cb||reg[a]===reg[b]||(Math.abs(ra-rb)<=1&&Math.abs(ca-cb)<=1)}
const steamR=n=>n>=7?2:1;
function clearAround(i){const{n,hid}=G,R=steamR(n),r=i/n|0,c=i%n,o=[];for(let x=0;x<n*n;x++){if(!hid[x])continue;const d=Math.max(Math.abs((x/n|0)-r),Math.abs(x%n-c));if(d<=R)o.push([x,d])}return o}
function liftFog(list){if(!list.length)return;sfx.steam();list.forEach(([x,d])=>{G.hid[x]=0;const c=$(`.cell[data-i="${x}"]`),f=c&&c.querySelector(".fog");if(c)c.classList.remove("fogged");if(f){f.style.transitionDelay=d*75+"ms";f.classList.add("gone");setTimeout(()=>f.remove(),900)}})}
const atk=(a,b)=>{if(a===b)return false;const{n,NN,reg,hid}=G,fa=a/NN|0,fb=b/NN|0,pa=a%NN,pb=b%NN;if(fa!==fb)return Math.abs(fa-fb)===1&&pa===pb;const ra=pa/n|0,ca=pa%n,rb=pb/n|0,cb=pb%n;return ra===rb||ca===cb||(Math.abs(ra-rb)<=1&&Math.abs(ca-cb)<=1)||(!hid[a]&&!hid[b]&&reg[a]===reg[b])};
function infoUnits(){const{n,NN,F,reg,hid,cells}=G,u=[];
 for(let f=0;f<F;f++){const base=f*NN;for(let i=0;i<n;i++){u.push({k:"rij",f,c:[...Array(n).keys()].map(x=>base+i*n+x)});u.push({k:"kolom",f,c:[...Array(n).keys()].map(x=>base+x*n+i)});
  const vis=[...Array(NN).keys()].map(x=>base+x).filter(x=>reg[x]===f*n+i&&!hid[x]);
  if(vis.length&&vis.every(x=>{const p=x-base,r=p/n|0,c=p%n;return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].every(([a,b])=>a<0||b<0||a>=n||b>=n||!hid[base+a*n+b])}))u.push({k:"kleur",f,c:vis})}}
 return u.filter(x=>!x.c.some(y=>cells[y]===2))}

function pairCtx(n,reg){const N=n*n,rows=[],cols=[],colors=[],nb=[];
 for(let i=0;i<n;i++){rows.push([...Array(n).keys()].map(c=>i*n+c));cols.push([...Array(n).keys()].map(r=>r*n+i));colors.push([...Array(N).keys()].filter(x=>reg[x]===i))}
 for(let x=0;x<N;x++){const r=x/n|0,c=x%n,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if((a||b)&&r+a>=0&&r+a<n&&c+b>=0&&c+b<n)o.push((r+a)*n+c+b)}nb.push(o)}
 return{n,N,reg,nb,units:[...rows.map((c,i)=>({k:"rij",c})),...cols.map((c,i)=>({k:"kolom",c})),...colors.map((c,i)=>({k:"kleur",c}))]}}
function pairStep(C,s){const{N,reg,nb,units}=C;
 for(let x=0;x<N;x++){if(s[x]!==1)continue;const m=nb[x].filter(y=>s[y]===1);
  if(m.length>1||m.some(y=>reg[y]!==reg[x]))return{bad:true};
  for(const y of nb[x])if(s[y]===0&&reg[y]!==reg[x])return{i:y,v:-1,why:"raak",from:x};
  if(m.length===1){for(const y of nb[x])if(s[y]===0)return{i:y,v:-1,why:"bezet",from:x}}
  else{const o=nb[x].filter(y=>s[y]===0&&reg[y]===reg[x]);if(!o.length)return{bad:true};if(o.length===1)return{i:o[0],v:1,why:"maatje",from:x}}}
 for(const u of units){let k=0;const o=[];for(const x of u.c){if(s[x]===1)k++;else if(s[x]===0)o.push(x)}
  if(k>2||k+o.length<2)return{bad:true};
  if(k===2&&o.length)return{i:o[0],v:-1,why:"vol",unit:u};
  if(k+o.length===2&&o.length)return{i:o[0],v:1,why:"precies",unit:u}}
 for(let x=0;x<N;x++){if(s[x]!==0)continue;if(!nb[x].some(y=>s[y]>=0&&reg[y]===reg[x]))return{i:x,v:-1,why:"geenmaatje"}}
 return null}
function pairFix(C,s){for(;;){const t=pairStep(C,s);if(!t)return true;if(t.bad)return false;s[t.i]=t.v}}
function pairWhatIf(C,s,N){for(let x=0;x<C.N;x++){if(s[x]!==0)continue;const a=s.slice();a[x]=1;if(!pairFix(C,a))return{i:x,v:-1,why:"alsdan"};const b=s.slice();b[x]=-1;if(!pairFix(C,b))return{i:x,v:1,why:"alsdan"}}return null}
const pairState=()=>{const s=new Int8Array(G.N);G.cells.forEach((v,i)=>{s[i]=v===2?1:v?-1:0});return s};
const pairMates=x=>G.C.nb[x].filter(y=>G.cells[y]===2);
function pairBlocked(){const{C,cells,reg}=G,b=new Set();cells.forEach((v,x)=>{if(v===2)return;for(const u of C.units)if(u.c.includes(x)&&u.c.filter(y=>cells[y]===2).length>=2)b.add(x);for(const y of pairMates(x))if(reg[y]!==reg[x]||pairMates(y).length)b.add(x)});return b}
function pairReason(i){const{C,cells,reg}=G;
 for(const u of C.units)if(u.c.includes(i)){const k=u.c.filter(y=>cells[y]===2);if(k.length>=2)return{msg:`Deze ${u.k} heeft al twee capy’s.`,cause:k}}
 const m=pairMates(i).find(y=>reg[y]!==reg[i]);if(m!==undefined)return{msg:"Capy’s uit verschillende kleuren mogen elkaar niet raken.",cause:[m]};
 if(!C.nb[i].some(y=>reg[y]===reg[i]&&cells[y]!==3))return{msg:"Hier kan geen maatje van dezelfde kleur naast zitten.",cause:[]};
 const o=pairMates(i).find(y=>reg[y]===reg[i]);if(o===undefined&&G.cells.some((v,y)=>v===2&&reg[y]===reg[i]))return{msg:"Het maatje moet de capy van deze kleur raken.",cause:G.sol.filter(y=>cells[y]===2&&reg[y]===reg[i])};
 return{msg:"Hier past geen capy, dan loopt het paar of een rij vast.",cause:[]}}
function pairHint(put){const{C,cells}=G,s=pairState(),xs=[];
 for(;;){let t=pairStep(C,s);if(t&&t.bad)break;if(!t)t=pairWhatIf(C,s);if(!t)break;
  if(t.v===-1){s[t.i]=-1;if(cells[t.i]===0)xs.push(t.i);continue}
  if(xs.length)setCells(xs.map(i=>[i,1]));
  return put(t.i,t.why==="maatje"?"Deze capy heeft nog maar één plek voor zijn maatje.":t.why==="precies"?`In deze ${t.unit.k} zijn nog precies genoeg plekken over.`:"Elke andere keuze loopt vast, dus hier hoort een capy.")}
 if(xs.length)setCells(xs.map(i=>[i,1]));put(G.sol.find(i=>cells[i]!==2),"Hier hoort een capy.")}

 const keep=new Set([...next.gv].map(Number)),b=$("#board");b.classList.add("won");sfx.ding();hap([15,30,15]);
 $("#coach").textContent=`Het bad groeit naar ${next.n} bij ${next.n}!`;

 setTimeout(()=>{if(!G||G.mode!=="groei")return;const sk={},stay=[];G.sol.forEach(x=>{const r=x/n|0,c=x%n,R=r+(r>=next.ir),C=c+(c>=next.ic);if(keep.has(R)){sk[R*next.n+C]=skinIdx(x);stay.push([r,c])}});const crosses=[];G.cells.forEach((v,y)=>{if(v!==1)return;const yr=y/n|0,yc=y%n;if(stay.some(([r,c])=>yr===r||yc===c||(Math.abs(yr-r)<=1&&Math.abs(yc-c)<=1)))crosses.push((yr+(yr>=next.ir))*next.n+yc+(yc>=next.ic))});GC={time:G.time,mistakes:G.mistakes,hints:G.hints,skin:sk,crosses,grow:{ir:next.ir,ic:next.ic}};const idx=G.idx+1;S.cur=null;G=null;start(next,"groei",idx);sfx.harvest()},1250)}

function start(l,mode,idx){

 const n=l.n,F=l.f||1,k=l.k||1,NN=n*n,N=NN*F,reg=[...l.r].map((v,x)=>v==="x"?-1:+v+(x/NN|0)*n),shape=l.r.includes("x"),sol=[...l.s].map((v,i)=>{const j=i/k|0;return (j/n|0)*NN+(j%n)*n+ +v});
 const hid=l.m?[...l.m].map(Number):new Array(N).fill(0);
 G={n,F,k,shape,name:l.name,C:k===2?pairCtx(n,reg):null,hearts:new Set(),NN,N,fl:c&&c.fl||0,reg,sol,hid,steam:!!l.m,mode,idx,cells:c?c.cells.slice():new Array(N).fill(0),hist:[],hints:c?c.hints:0,mistakes:c?c.mistakes:0,time:c?c.time:0,combo:0,over:false,tut:null};

  if(GC){G.time=GC.time;G.mistakes=GC.mistakes;G.hints=GC.hints;if(GC.grow&&!c)G.grown=GC.grow;GC=null}}
 if(!c&&!S.tut&&F===1&&k===1&&!shape&&mode!=="spurt"&&mode!=="groei")tutInit();

}

function tutInit(){

 const S0=sol.find(i=>!G.hid[i]),A=[...Array(n*n).keys()].find(i=>!isSol(i));
 let B=-1;for(let i=n;i<n*n-1&&B<0;i++)if(i%n<n-1&&!isSol(i)&&!isSol(i+1)&&i!==A&&i+1!==A)B=i;

 G.tutSteps=[

 ];

}
function settings(){
 const sw=(k,l)=>`<div class="row"><span>${l}</span><button class="switch" role="switch" aria-checked="${S[k]}" data-act="toggle" data-k="${k}">${S[k]?"Aan":"Uit"}</button></div>`;
 dlg.innerHTML=`<h2>Instellingen</h2>${sw("sound","Geluid")}${sw("haptics","Trillen")}${sw("auto","Stippen na het plaatsen van een capy")}${sw("fast","Testmodus: tijd 60× sneller")}<button class="btn quiet" data-act="replaytut" style="margin-top:12px">Bekijk de uitleg opnieuw</button><button class="btn quiet" data-act="reset">Begin opnieuw</button><button class="btn" data-act="close">Klaar</button>`;
 if(!dlg.open)dlg.showModal();
}
async function doShare(){const text=$("#sharetxt").textContent,b=$("[data-act=share]");try{if(navigator.share){await navigator.share({text});return}await navigator.clipboard.writeText(text);b.textContent="Gekopieerd"}catch(e){if(e&&e.name==="AbortError")return;b.textContent="Selecteer de tekst om te delen"}}
function goHome(){persist();G=null;tab="cafe";if(dlg.open)dlg.close();render()}
function playNext(){if(dlg.open)dlg.close();const n=nextLevel();G=null;if(n<0)return goHome();start(LEVELS[n],"level",n)}
function collectTips(){const v=tipsNow();if(!v)return;S.yuzu+=v;S.tipAt=vnow();save();sfx.buy();const from=$("#tips").getBoundingClientRect(),to=$(".pill").getBoundingClientRect();
 if(!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let i=0;i<6;i++){const d=document.createElement("i");d.className="fly";d.style.cssText=`left:${from.left+from.width/2}px;top:${from.top+10}px;--dx:${to.left-from.left-from.width/2+14}px;--dy:${to.top-from.top}px;animation-delay:${i*60}ms`;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
 setTimeout(()=>{updPill();refreshLive()},700)}
function welcome(){const away=vnow()-(S.seen||vnow());S.seen=vnow();if(away<2*36e5)return;spawnGifts();const tips=tipsNow(),gifts=S.gifts.length,ripe=S.plots.filter(plotReady).length,hungry=owned().filter(c=>P(c).full<25).map(c=>c.name);
 const items=[tips?`${YUZU}<span>${tips} yuzu aan fooien</span>`:"",gifts?`${treasIcon(TREAS[0])}<span>${gifts} ${gifts===1?"cadeautje ligt":"cadeautjes liggen"} klaar</span>`:"",ripe?`${foodIcon("gras")}<span>${ripe} ${ripe===1?"bak is":"bakken zijn"} klaar om te oogsten</span>`:"",hungry.length?`${HEARTS}<span>${hungry.join(", ")} ${hungry.length===1?"heeft":"hebben"} honger</span>`:""].filter(Boolean);
 if(!items.length)return;save();dlg.innerHTML=`<h2>Welkom terug!</h2><p class="intro">Terwijl je weg was:</p><div class="wb">${items.map(x=>`<div>${x}</div>`).join("")}</div><button class="btn" data-act="close">Naar het café</button>`;dlg.showModal()}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-act],[data-level],[data-etage],[data-knuffel],[data-vorm],[data-groei],[data-floor],[data-buy],[data-room],[data-sel],[data-pet],[data-feed],[data-gift],[data-plot],[data-plant],[data-claim],[data-sbuy],[data-zbuy],[data-xbuy],[data-stab],[data-droom],[data-visit]");if(!t)return;
 const ds=t.dataset;
 if(ds.room){W.room=ds.room;S.view=ds.room;save();return renderScene()}
 if(ds.sel)return selectCapy(ds.sel,true);
 if(ds.pet)return petCapy(ds.pet);
 if(ds.feed)return feed(W.sel,ds.feed);
 if(ds.gift)return pickGift(ds.gift);
 if(ds.plot!==undefined)return tapPlot(+ds.plot);
 if(ds.plant)return plant(ds.plant);
 if(ds.claim!==undefined){const g=goalsToday(),it=g.list[+ds.claim];if(it&&!it.got&&it.n>=GOALS[it.k][1]){it.got=true;S.yuzu+=15;save();sfx.buy();renderCafe()}return}
 if(ds.sbuy){const F=FOOD[ds.sbuy];if(S.yuzu<F.price)return;S.yuzu-=F.price;S.inv[ds.sbuy]=(S.inv[ds.sbuy]||0)+1;save();sfx.buy();hap(8);return renderShop()}
 if(ds.zbuy){const F=FOOD[ds.zbuy];if(S.yuzu<F.seed)return;S.yuzu-=F.seed;S.seeds[ds.zbuy]=(S.seeds[ds.zbuy]||0)+1;save();sfx.buy();hap(8);return renderShop()}
 if(ds.xbuy){const x=EXP().find(e=>e.id===ds.xbuy);if(!x||x.own||x.lock||S.yuzu<x.price)return;S.yuzu-=x.price;sfx.level();hap(20);if(x.id==="bad"){S.rooms.bad=true;S.newRoom="bad";S.view="bad";W.room="bad";syncActors();Object.values(W.actors).slice(0,3).forEach(a=>{a.room="bad";[a.x,a.y]=randIn("bad");a.st="idle";a.spot=null})}else{S.plotN++;ensureRooms();S.view="tuin";W.room="tuin";toast("Nieuwe moestuinbak staat in de tuin.")}save();tab="cafe";return render()}
 if(ds.stab){stab=ds.stab;return renderShop()}
 if(ds.droom){droom=ds.droom;return renderShop()}
 if(ds.visit){tab="cafe";render();return selectCapy(ds.visit,true)}
 if(t.dataset.floor!==undefined)return gotoFloor(+t.dataset.floor,true);
 if(t.dataset.groei!==undefined){G=null;S.cur=null;return start(GROEI[+t.dataset.groei][0],"groei",+t.dataset.groei*10)}
 if(t.dataset.vorm!==undefined){G=null;return start(VORMEN[+t.dataset.vorm],"vorm",+t.dataset.vorm)}
 if(t.dataset.knuffel!==undefined){G=null;return start(KNUFFELS[+t.dataset.knuffel],"knuffel",+t.dataset.knuffel)}
 if(t.dataset.etage!==undefined){G=null;return start(ETAGES[+t.dataset.etage],"etage",+t.dataset.etage)}
 if(t.dataset.tab){tab=t.dataset.tab;quote=null;return render()}
 if(t.dataset.level){G=null;return start(LEVELS[+t.dataset.level],"level",+t.dataset.level)}
 if(t.dataset.buy){const d=DECOR.find(x=>x.id===t.dataset.buy);if(S.yuzu<d.price||hasD(d.id))return;S.yuzu-=d.price;S.decor.push(d.id);save();sfx.buy();hap(20);W.pop=d.id;S.view=d.room;W.room=d.room;tab="cafe";render();return toast(`${d.name} staat erin. Gezelligheid ${cozy()} van 5.`)}
  switch(t.dataset.act){
  case"next":return playNext();
  case"enext":{if(dlg.open)dlg.close();const k=nextEtage();G=null;if(k<0)return goHome();return start(ETAGES[k],"etage",k)}
  case"etages":{const c=S.cur&&S.cur.mode==="etage"?S.cur.idx:nextEtage();if(c<0){tab="levels";ltab="etage";return render()}G=null;return start(ETAGES[c],"etage",c)}
  case"gnext":{if(dlg.open)dlg.close();const k=nextGroei();G=null;if(k<0)return goHome();return start(GROEI[k][0],"groei",k*10)}
  case"groei":{const c=S.cur&&S.cur.mode==="groei"?S.cur.idx:null;G=null;if(c!==null)return start(GROEI[c/10|0][c%10],"groei",c);const k=nextGroei();if(k<0){ltab="groei";return render()}return start(GROEI[k][0],"groei",k*10)}
  case"vnext":{if(dlg.open)dlg.close();const k=nextVorm();G=null;if(k<0)return goHome();return start(VORMEN[k],"vorm",k)}
  case"vormen":tab="levels";ltab="vorm";return render();
  case"spurt":return spurtIntro();
  case"sgo":return spurtGo();
  case"skipb":{if(G.over)return;SP.time-=15;spurtShow();if(SP.time<=0)return spurtEnd();return spurtBoard()}
  case"knext":{if(dlg.open)dlg.close();const k=nextKnuffel();G=null;if(k<0)return goHome();return start(KNUFFELS[k],"knuffel",k)}
  case"knuffels":{const c=S.cur&&S.cur.mode==="knuffel"?S.cur.idx:nextKnuffel();if(c<0){tab="levels";ltab="knuffel";return render()}G=null;return start(KNUFFELS[c],"knuffel",c)}
  case"ltab":ltab=t.dataset.v;return render();
  case"tab-levels":tab="levels";return render();
  case"daily":{const d=dayNo();if(S.dailyDone[d])return toast("Deze heb je al gehaald. Morgen staat er een nieuwe klaar.");G=null;return start(DAILY[d%DAILY.length],"daily",d)}
  case"tips":return collectTips();
  case"toshop":if(dlg.open)dlg.close();stab=t.dataset.v||"voer";tab="shop";return render();
  case"gotoroom":dlg.close();W.room=t.dataset.v;S.view=W.room;save();return renderScene();
  case"lockroom":return toast(t.dataset.v==="tuin"?`De tuin gaat open na 3 puzzels. Nog ${Math.max(0,3-doneCount())} te gaan.`:"Het badhuis koop je in de winkel onder Uitbreiden.");
  case"gbonus":{const g=goalsToday();if(g.bonus||!g.list.every(x=>x.got))return;g.bonus=true;S.inv.taart=(S.inv.taart||0)+1;S.yuzu+=30;save();sfx.level();toast("Taart en 30 yuzu! Morgen nieuwe doelen.");return renderCafe()}
  case"settings":return settings();
  case"quit":case"home":return goHome();
  case"share":return doShare();
  case"close":dlg.close();return !G&&tab==="cafe"?render():undefined;
  case"skiptut":G.tut=null;S.tut=true;G.cells=G.cells.map(v=>v===1?0:v);G.hist=[];$(".tools").innerHTML=toolsHTML();$("#coach").textContent=coachText();drawTut();paint();return persist();
  case"undo":{let h;while((h=G.hist.pop())){const live=h.filter(([i])=>G.cells[i]<2);if(live.length){live.forEach(([i,v])=>G.cells[i]=v);gotoFloor(live[0][0]/G.NN|0);break}}lastTap.i=-1;paint();$("#coach").textContent=coachText();return persist()}
  case"clear":{const ch=[];G.cells.forEach((v,i)=>{if(v===1&&(i/G.NN|0)===G.fl)ch.push([i,0])});if(ch.length){setCells(ch);paint();persist()}return}
  case"hint":return hint();
  case"toggle":{const k=t.dataset.k;if(k==="fast"){setFast(!S.fast);return settings()}S[k]=!S[k];save();if(G)paint();return settings()}
  case"replaytut":S.tut=false;save();dlg.close();return toast("De uitleg start bij je volgende nieuwe puzzel.");
  case"reset":{if(t.dataset.sure){const s=S.sound;S=fresh();S.sound=s;save();W.actors={};W.sel=null;dlg.close();G=null;tab="cafe";quote=null;return render()}t.dataset.sure="1";t.textContent="Tik nogmaals om alles te wissen";return}
 }
});
document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("[data-capy],[data-pet],[data-gift],[data-plot]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(G)persist();S.seen=vnow();save()}else if(!G&&tab==="cafe"){welcome();render()}});
setInterval(()=>{if(!document.hidden){S.seen=vnow();save()}},30000);
ensureRooms();render();welcome();
</script>
</body>
</html>
