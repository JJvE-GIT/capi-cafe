<style>
:root{
  color-scheme:light;
  --bg:#D7EDCB;--surface:#F7FBEA;--surface2:#E9F4D8;--ink:#1F3B2E;--muted:#4A6656;
  --yuzu:#FFBE1A;--yuzu-edge:#C98C00;--on-yuzu:#2B2410;--water:#1B827C;--on-water:#fff;--berry:#C92C55;
  --edge:#1F3B2E;--thin:rgba(31,59,46,.2);--mark:rgba(31,59,46,.72);
  --steam:#D5E7E2;--steam2:#FBFEFC;--hill:#9ED18B;--grass:#A8D98C;--grass2:#8FC873;--soil:#7A5236;--soil2:#5E3E27;--tile:#D6EEF0;--tile2:#BCDFE3;--pool:#5CC9C2;--frame:#8A5A34;--frame2:#5E3A20;--wall:#BFE3D2;--wall2:#A9D6C2;--floor:#D9A873;--floor2:#C88F58;--sky:#BDE9FF;--wood:#8A5A34;
  --r0:#FFC4BC;--r1:#FFE083;--r2:#B6E39F;--r3:#A5DBF2;--r4:#D3C0F6;--r5:#F8B6DA;--r6:#FFC88D;--r7:#A3E4CE;--r8:#DFD3AE;--r9:#D5EC86;--r10:#B3BDF6;--r11:#D2D2CF;--r12:#F59E92;--r13:#E0A3F0;--r14:#86C5A0;--r15:#F3D1C2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10302A;--surface:#1B4239;--surface2:#245247;--ink:#EEF7E4;--muted:#B3CFBD;
  --water:#58D2C7;--on-water:#0F2B25;--berry:#FF8AA5;--edge:#06201A;--thin:rgba(6,32,26,.35);--mark:rgba(255,255,255,.86);
  --steam:#4D736B;--steam2:#7FA69D;--hill:#2E6B45;--grass:#3E7F4E;--grass2:#336B41;--soil:#4E3423;--soil2:#3A2618;--tile:#2B5A5E;--tile2:#234A4E;--pool:#2E8F8A;--frame:#6B4327;--frame2:#3E2513;--wall:#2A5E55;--wall2:#234F47;--floor:#6E4A30;--floor2:#5C3C26;--sky:#16264F;--wood:#57361F;
  --r0:#B5615A;--r1:#A98B2B;--r2:#5B9346;--r3:#3C84A8;--r4:#7A62B3;--r5:#AE5A90;--r6:#B87236;--r7:#35967C;--r8:#887C57;--r9:#7F9A2E;--r10:#5662AE;--r11:#6E6E6A;--r12:#B4544A;--r13:#9A5BB0;--r14:#4E8A66;--r15:#A88A7C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10302A;--surface:#1B4239;--surface2:#245247;--ink:#EEF7E4;--muted:#B3CFBD;
  --water:#58D2C7;--on-water:#0F2B25;--berry:#FF8AA5;--edge:#06201A;--thin:rgba(6,32,26,.35);--mark:rgba(255,255,255,.86);
  --steam:#4D736B;--steam2:#7FA69D;--hill:#2E6B45;--grass:#3E7F4E;--grass2:#336B41;--soil:#4E3423;--soil2:#3A2618;--tile:#2B5A5E;--tile2:#234A4E;--pool:#2E8F8A;--frame:#6B4327;--frame2:#3E2513;--wall:#2A5E55;--wall2:#234F47;--floor:#6E4A30;--floor2:#5C3C26;--sky:#16264F;--wood:#57361F;
  --r0:#B5615A;--r1:#A98B2B;--r2:#5B9346;--r3:#3C84A8;--r4:#7A62B3;--r5:#AE5A90;--r6:#B87236;--r7:#35967C;--r8:#887C57;--r9:#7F9A2E;--r10:#5662AE;--r11:#6E6E6A;--r12:#B4544A;--r13:#9A5BB0;--r14:#4E8A66;--r15:#A88A7C;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Gabarito","Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,.display{font-family:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:400;line-height:1.05}
svg{display:block}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px}

.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top h1{font-size:30px;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);padding:6px 12px 6px 8px;border-radius:99px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.scene{border-radius:26px 26px 12px 12px;overflow:hidden;background:var(--wall);border:3px solid var(--edge)}
.scene svg{width:100%;height:auto}
.scene .capy-g{cursor:pointer}
.scene .pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
.bubble{background:var(--surface);border-radius:14px;padding:9px 13px;margin-top:10px;min-height:46px;color:var(--ink);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:10px 18px;border-radius:18px;background:var(--yuzu);color:var(--on-yuzu);font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:23px;box-shadow:0 6px 0 var(--yuzu-edge);margin-bottom:6px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yuzu-edge)}
.btn.quiet{background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--surface2);font-size:20px}
.btn.quiet:active{box-shadow:0 2px 0 var(--surface2)}
.progress{margin:14px 0}
.progress .lbl{font-weight:600;margin-bottom:6px}
.bar{height:12px;background:var(--surface);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water);border-radius:9px}
.daily{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;margin-top:14px;width:100%;text-align:left}
.daily .big{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;line-height:1.1}
.daily .sub{color:var(--muted);font-size:15px}
.daily .cal{width:52px;height:52px;background:var(--water);color:var(--on-water);border-radius:14px;display:grid;place-items:center;font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:24px;flex:none}
:root[data-theme="dark"] .daily .cal{color:#10302A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .daily .cal{color:#10302A}}

nav{display:flex;gap:4px;padding:6px 10px 8px;background:var(--surface);border-radius:20px 20px 0 0}
nav button{flex:1;min-height:52px;border-radius:13px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{background:var(--surface2);color:var(--ink);font-weight:800}

.section-h{font-size:24px;margin:18px 0 3px}
.section-p{color:var(--muted);margin-bottom:12px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;line-height:1}
.lv small{font-family:"Gabarito",sans-serif;font-size:11px;color:var(--yuzu-edge);letter-spacing:0;margin-top:3px;font-weight:800;min-height:13px}
.lv.next{background:var(--yuzu);color:var(--on-yuzu)}
.lv:disabled{opacity:.5;cursor:default;background:var(--surface2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv small{color:var(--yuzu)}}
:root[data-theme="dark"] .lv small{color:var(--yuzu)}

.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .pre{background:var(--wall);border-radius:12px;overflow:hidden;height:104px;padding:6px}
.item .pre svg{width:100%;height:100%}
.item b{font-weight:800;line-height:1.15}
.buy{min-height:44px;border-radius:12px;background:var(--yuzu);color:var(--on-yuzu);font-weight:800;margin-top:auto}
.buy:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.capys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:18px;padding:12px;text-align:center}
.card svg{width:128px;height:auto;margin:0 auto 6px}
.card b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:20px;display:block}
.card span{color:var(--muted);font-size:15px;line-height:1.25;display:block;margin-top:3px}
.card.locked svg{filter:brightness(0) opacity(.28)}
:root[data-theme="dark"] .card.locked svg{filter:brightness(0) invert(1) opacity(.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.locked svg{filter:brightness(0) invert(1) opacity(.2)}}

#game{position:relative;height:100%;display:flex;flex-direction:column;padding:0 12px 12px}
.g-top{display:flex;align-items:center;gap:10px;padding:10px 0}
.g-top h2{font-size:24px;flex:1;min-width:0}
.meter{display:flex;gap:1px}.meter svg{width:22px;height:22px;color:var(--thin)}.meter svg.on{color:var(--yuzu)}.meter svg.lost{animation:lost .55s ease}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:19px}
.board-row{flex:1;min-height:0;display:flex;gap:9px;align-items:center}
.board-wrap{flex:1;min-width:0;height:100%;container-type:size;display:flex;flex-direction:column;overflow:auto;scrollbar-width:none}.board-wrap::-webkit-scrollbar{display:none}.board-wrap>.board{margin:auto;flex:none}.board-wrap>.track+.board{margin:0 auto auto}.board-wrap>.track{margin:auto auto 4px;flex:none}.board-wrap.zoomed>.track{display:none}.board-wrap.zoomed>.track+.board{margin:auto}
.lift{flex:none;width:60px;display:flex;flex-direction:column;gap:7px;padding:5px;background:var(--frame);border-radius:14px;box-shadow:0 5px 0 var(--frame2)}
.lift button{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:7px;overflow:hidden;opacity:.72}
.lift button svg{width:100%;height:100%}
.lift button[aria-current]{outline:3px solid var(--yuzu);outline-offset:1px;opacity:1}
.lift .no{position:absolute;left:3px;top:2px;min-width:16px;height:16px;border-radius:5px;background:var(--edge);color:#fff;font-size:12px;font-weight:800;line-height:16px;text-align:center}
.lift .done .no{background:var(--water)}
.tower{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.tower svg{width:56px;height:56px;border-radius:7px;border:2px solid var(--edge)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.duo .daily{margin-top:0;padding:8px 10px;gap:9px;min-width:0}
.duo .daily.wide{grid-column:1/3}
.duo .cal{width:38px;height:38px;font-size:19px;border-radius:11px}
.duo .cal svg{width:24px;height:24px}
.duo .big{font-size:17px}.duo .sub{font-size:13px}
.scene{position:relative}
.scene .bubble{position:absolute;left:8px;right:8px;top:8px;margin:0;min-height:0;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 2px 0 var(--edge)}
.scene .bubble.on{opacity:1;transform:none}
.board.shape{background:transparent;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 5px 0 var(--frame2))}
.hole{display:block}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shapecard{background:var(--surface);border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shapecard svg{width:74px;height:74px}
.shapecard b{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:17px;line-height:1.1}
.shapecard small{font-size:11px;color:var(--yuzu-edge);font-weight:800;min-height:13px}
.shapeart svg{width:96px;height:96px;margin:0 auto 8px}
.steamart.shapeart{width:auto}
.score{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:21px;color:var(--water);font-variant-numeric:tabular-nums}
.timer.low{color:var(--berry);animation:tickp 1s ease-in-out infinite}
.timer.hit{color:var(--berry);animation:oops .34s}
.bigscore{font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif;font-size:58px;line-height:1;color:var(--water);margin:6px 0}
.heart{position:absolute;width:calc(100%/var(--n)*.42);aspect-ratio:1;margin:calc(-100%/var(--n)*.21) 0 0 calc(-100%/var(--n)*.21);z-index:3;pointer-events:none;animation:heartin .42s cubic-bezier(.3,1.9,.5,1) both}
.heart svg{width:100%;height:100%}
.cell .c.hug{animation:hugin .3s ease-out both}
.c.hug .eye-o{display:none}.c.hug .eye-h{display:inline}
.won .c.hug{animation:winhop .58s cubic-bezier(.3,.8,.4,1) both;animation-delay:calc(var(--i)*var(--hs,70ms))}
.seg{display:flex;background:var(--surface);border-radius:13px;padding:4px;margin-bottom:6px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--yuzu);color:var(--on-yuzu)}
.cell .shade{width:80%;height:80%;color:var(--mark);opacity:.4}
.board.instant .cell:not(.nudge){animation:none}
.board.up{animation:liftup .26s ease-out}.board.down{animation:liftdown .26s ease-out}
.board{width:calc(min(100cqw,100cqh - var(--trk,0px))*var(--z,1));aspect-ratio:1;display:grid;border:6px solid var(--frame);border-radius:18px;overflow:hidden;touch-action:none;background:var(--edge);position:relative;box-shadow:0 6px 0 var(--frame2)}
.board.oops{animation:oops .34s}
.ghost{position:absolute;width:calc(100%/var(--n)*.55);aspect-ratio:1;margin:calc(-100%/var(--n)*.275) 0 0 calc(-100%/var(--n)*.275);border-radius:50%;background:rgba(255,255,255,.72);border:3px solid var(--ink);pointer-events:none;z-index:3}
.ghost.tap{animation:gtap 1.2s ease-in-out infinite}.ghost.double{animation:gdbl 1.4s ease-in-out infinite}.ghost.swipe{animation:gswipe 1.5s ease-in-out infinite}
.cell{position:relative;display:grid;place-items:center;border:.5px solid var(--thin);min-width:0;min-height:0;padding:0;border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.cell.rc{filter:brightness(1.1)}
.cell.pulse{filter:brightness(1.14) saturate(1.1);transition:filter .3s}
.cell.nudge{animation:nudge .24s}
.cell.cause{outline:4px solid var(--berry);outline-offset:-4px;z-index:3}
.cell.tut{outline:4px solid var(--yuzu);outline-offset:-4px;z-index:3}
.cell.ring::before{content:"";position:absolute;inset:8%;border-radius:50%;border:3px solid #fff;animation:ring .5s ease-out both;pointer-events:none}
.cell.t{border-top:2px solid var(--edge)}.cell.r{border-right:2px solid var(--edge)}.cell.b{border-bottom:2px solid var(--edge)}.cell.l{border-left:2px solid var(--edge)}
.cell:focus-visible{outline:3px solid var(--water);outline-offset:-3px;z-index:2}
.cell svg{width:100%;height:100%;grid-area:1/1;position:relative;z-index:2}
.cell.fogged{border:0!important;box-shadow:none}
.fog{position:absolute;inset:-1px;z-index:1;background-color:var(--steam);background-image:radial-gradient(circle at 18% 24%,var(--steam2) 0 9%,transparent 15%),radial-gradient(circle at 62% 16%,var(--steam2) 0 12%,transparent 19%),radial-gradient(circle at 40% 52%,var(--steam2) 0 13%,transparent 21%),radial-gradient(circle at 84% 58%,var(--steam2) 0 11%,transparent 18%),radial-gradient(circle at 20% 84%,var(--steam2) 0 12%,transparent 19%),radial-gradient(circle at 66% 90%,var(--steam2) 0 10%,transparent 17%);background-size:calc(var(--n)*100%) calc(var(--n)*100%);background-position:calc(var(--c)/(var(--n) - 1)*100%) calc(var(--w)/(var(--n) - 1)*100%);transition:opacity .42s ease-out,transform .42s ease-out;pointer-events:none}
.fog.gone{opacity:0;transform:scale(1.4) translateY(-10%)}
.steamart{width:190px;margin:0 auto 8px}
.intro{margin-bottom:10px;line-height:1.35}
dialog .intro:last-of-type{margin-bottom:16px}
.cell .c{position:relative;z-index:1;width:92%;height:92%;transform-origin:50% 92%;animation:land .36s cubic-bezier(.3,.9,.4,1) both}
.cell[data-v^="capy"]::after{content:"";position:absolute;left:20%;right:20%;bottom:4%;height:10%;border-radius:50%;background:rgba(20,40,30,.2);animation:shadin .36s ease-out both}
.dust{position:absolute;left:50%;bottom:3%;width:18%;aspect-ratio:1;margin-left:-9%;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(20,40,30,.07);z-index:0;pointer-events:none;animation:dust .46s ease-out both}
.cell .c.nope{animation:nope .6s ease both}
.cell .x.bad{color:var(--berry);width:50%;height:50%;animation:plop .2s both}
.cell .x{width:42%;height:42%;color:var(--mark)}
.cell.dot::after{position:relative;z-index:2;content:"";width:16%;aspect-ratio:1;border-radius:50%;background:var(--mark);opacity:.55;grid-area:1/1}
.cell.hint{outline:4px solid var(--water);outline-offset:-4px;z-index:3;box-shadow:inset 0 0 0 4px var(--water);animation:glow .9s ease-in-out 3}
.eye-h{display:none}
.won .eye-o{display:none}.won .eye-h{display:inline}
.won .c{animation:winhop .58s cubic-bezier(.3,.8,.4,1) both;animation-delay:calc(var(--i)*var(--hs,70ms))}
.coach{min-height:46px;padding:8px 2px 4px;font-weight:600;text-align:center;line-height:1.25}
.tools{display:flex;gap:8px}
.tools button{flex:1;min-height:52px;border-radius:15px;background:var(--surface);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.tools svg{width:21px;height:21px}
.tools button:disabled{opacity:.45;cursor:default}
.drop{position:absolute;top:-10%;width:7%;aspect-ratio:1;border-radius:50%;background:var(--yuzu);animation:fall 1s ease-in both;pointer-events:none}

dialog{border:0;border-radius:26px;background:var(--surface);color:var(--ink);padding:22px 18px 16px;width:min(92vw,400px);text-align:center}
dialog::backdrop{background:rgba(9,36,30,.6)}
dialog h2{font-size:30px;margin-bottom:6px}
.stars{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.stars svg{width:44px;height:44px;color:var(--surface2)}
.stars svg.on{color:var(--yuzu);animation:starin .42s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(var(--k)*190ms)}
.reward{font-weight:800;font-size:19px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.reward svg{width:24px;height:24px}
.newcapy{background:var(--surface2);border-radius:18px;padding:12px;margin:8px 0 14px}
.newcapy svg{width:150px;margin:0 auto 6px;animation:reveal .8s .75s both}

function pairCtx(n,reg){const N=n*n,rows=[],cols=[],colors=[],nb=[];

function pairStep(C,s){const{N,reg,nb,units}=C;

  if(m.length>1||m.some(y=>reg[y]!==reg[x]))return{bad:true};
